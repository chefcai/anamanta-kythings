# Default server definition, based on the trafex/php-nginx base image's own
# conf.d/default.conf (see the Dockerfile for why this replaces it wholesale).
# Diff against the base is exactly the add_header block below -- everything
# else is unchanged, so a future base-image bump should be diffed against this
# file's history rather than assumed compatible.
server {
    listen [::]:8080 default_server;
    listen 8080 default_server;
    server_name _;

    sendfile off;
    tcp_nodelay on;
    absolute_redirect off;

    root /var/www/html;
    index index.php index.html;

    # --- Force HTTPS ---------------------------------------------------------
    # This container has no TLS of its own -- it is always reached through a
    # TLS-terminating front door (Cloudflare Tunnel in production). Cloudflare
    # sets X-Forwarded-Proto to the scheme the *client* used to reach its edge,
    # not the scheme cloudflared uses on its own hop to this container (which
    # is always plain HTTP regardless), so this reflects the visitor, not the
    # tunnel. A plain HTTP visit is 301'd to HTTPS on the same host and path.
    # No header at all (a direct, non-proxied request) does not match and is
    # not redirected -- if you front this with a different proxy, add a check
    # for whatever header it sets instead.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # --- Security response headers -----------------------------------------
    # `always` sends these on error responses too (4xx/5xx), not just 200s.
    # add_header is inherited into any location block below that does not
    # declare its own -- none currently do -- so this covers sun.php,
    # index.php, and the static app.js alike.

    # Clickjacking: belt (CSP frame-ancestors, below) and suspenders (the
    # older header, for browsers that predate frame-ancestors support).
    add_header X-Frame-Options "DENY" always;

    # Stop browsers guessing a response's type from its content instead of
    # its declared Content-Type.
    add_header X-Content-Type-Options "nosniff" always;

    # This site is always served over HTTPS (via Cloudflare Tunnel in
    # production); tell browsers to enforce that for a year. No `preload` --
    # that submits the domain to a hardcoded, effectively irreversible browser
    # list, which is a bigger commitment than this header is meant to make.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # index.php's only script is the same-origin app.js (no inline <script>,
    # no eval); its one inline element is a small <style> block, hence
    # 'unsafe-inline' scoped to style-src only, not script-src. The Google
    # Fonts stylesheet and the font files it references are the only other
    # externals the page loads. sun.php and app.js get the same policy --
    # harmless for a calendar feed and a static script, and one policy is one
    # less thing to keep in sync.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;

    # Modern isolation/least-privilege headers. Deliberately NOT setting
    # Cross-Origin-Embedder-Policy: this page loads the Google Fonts
    # stylesheet and font files cross-origin, and COEP's `require-corp` mode
    # blocks any cross-origin resource that doesn't send back its own CORP/
    # CORS grant -- real risk of silently breaking the Cinzel heading font
    # for a header this page has no actual need for (no SharedArrayBuffer,
    # nothing that needs process-isolation). COOP and CORP carry no such
    # cross-origin dependency and are safe to set unconditionally.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Explicit allow-nothing Permissions-Policy for every feature this page
    # could plausibly be granted but never uses. This is the maintained
    # replacement for the deprecated Feature-Policy header -- Feature-Policy
    # itself, along with X-XSS-Protection, Expect-CT and Public-Key-Pins,
    # is intentionally NOT set: all four are deprecated (Public-Key-Pins
    # doubly so -- misconfiguring HPKP can lock out your own domain), so a
    # scan listing them as "missing" is describing correct behaviour, not a
    # gap.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;

    location / {
        # First attempt to serve request as file, then
        # as directory, then fall back to index.php
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Redirect server error pages to the static page /50x.html
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/lib/nginx/html;
    }

    # Pass the PHP scripts to PHP-FPM listening on php-fpm.sock
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    # Set the cache-control headers on assets to cache for 5 days
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|xml)$ {
        expires 5d;
    }

    # Deny access to . files, for security
    location ~ /\. {
        log_not_found off;
        deny all;
    }

    # Allow fpm ping and status from localhost
    location ~ ^/(fpm-status|fpm-ping)$ {
        access_log off;
        allow 127.0.0.1;
        deny all;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm.sock;
    }
}
