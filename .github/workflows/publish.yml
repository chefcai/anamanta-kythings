name: Publish image

# Builds and pushes the image to GHCR on merge to master, and on a version tag.
#
# Deliberately does NOT deploy. squirttle pulls when Cai chooses. That is what
# keeps a merge from silently changing a live public calendar feed, and what
# preserves the approval gate on BRAIN-48.
#
# The runner never contacts squirttle, so there is no SSH key, no Tailscale
# credential and no inbound access anywhere in this pipeline. The only
# credential used is the automatic GITHUB_TOKEN.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/daylight-calendar-ics

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out (with upstream history for the regression baseline)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Build
        run: docker build -t kythings:candidate .

      - name: Prepare the upstream baseline
        run: |
          git remote add upstream https://github.com/chrisblakley/Daylight-Calendar-ICS.git || true
          git fetch --depth=1 upstream master
          git show upstream/master:sun.php > sun_upstream.php

      # Re-run the full suite here rather than trusting that CI passed on some
      # earlier commit. Nothing is pushed to the registry unproven.
      - name: Regression
        run: docker run --rm -v "$PWD":/app -w /app kythings:candidate sh /app/tests/regression.sh

      - name: Acceptance
        run: docker run --rm -v "$PWD":/app -w /app kythings:candidate php /app/tests/validate.php

      - name: Smoke test the served response
        run: |
          docker run -d --name smoke -p 8087:8080 kythings:candidate
          for i in $(seq 1 30); do curl -fsS -o /dev/null "http://127.0.0.1:8087/index.php" && break || sleep 2; done
          curl -fsS "http://127.0.0.1:8087/sun.php?lat=42.396&lng=-72.936&gmt=-5&year=2026&length=5&actual&noon&midnight" -o feed.ics
          grep -q '^BEGIN:VCALENDAR' feed.ics
          grep -q 'SUMMARY:Solar Noon' feed.ics
          grep -q 'SUMMARY:Solar Midnight' feed.ics
          if grep -qiE '(Deprecated:|Warning:|Notice:|Fatal error)' feed.ics; then
            echo "::error::PHP diagnostics leaked into the served feed"; exit 1
          fi
          docker rm -f smoke

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_LC=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')

          docker tag kythings:candidate "${IMAGE_LC}:sha-${SHORT_SHA}"
          docker push "${IMAGE_LC}:sha-${SHORT_SHA}"

          # :latest only moves for master, never for a tag build.
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            docker tag kythings:candidate "${IMAGE_LC}:latest"
            docker push "${IMAGE_LC}:latest"
          fi

          # Semver tag, when this run was triggered by one.
          case "${GITHUB_REF}" in
            refs/tags/v*)
              VERSION="${GITHUB_REF#refs/tags/}"
              docker tag kythings:candidate "${IMAGE_LC}:${VERSION}"
              docker push "${IMAGE_LC}:${VERSION}"
              ;;
          esac

          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${IMAGE_LC}:sha-${SHORT_SHA}"
            [ "${GITHUB_REF}" = "refs/heads/master" ] && echo "${IMAGE_LC}:latest"
            echo '```'
            echo ""
            echo "Deploy on squirttle:"
            echo '```sh'
            echo "cd /home/haadmin/arrs && docker compose pull kythings && docker compose up -d kythings"
            echo '```'
            echo "Rollback: point the compose \`image:\` at a previous \`sha-\` tag and re-run the above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        run: docker rm -f smoke || true
